<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}WhatsApp inbox{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="/">
          <span class="brand-mark">W</span>
          <span>
            <strong>wa.inbox</strong>
            <small>Twilio receiver</small>
          </span>
        </a>

        <nav class="nav">
          <a class="nav-link active" href="/">
            <span class="nav-icon">⌁</span>
            Messages
          </a>
          <a class="nav-link" href="/healthz">
            <span class="nav-icon">◌</span>
            Health check
          </a>
        </nav>

        <div class="sidebar-note">
          <span class="eyebrow">Webhook endpoint</span>
          <code>{{ webhook_path }}</code>
          <p>Point your Twilio WhatsApp number here using HTTP POST.</p>
        </div>
      </aside>

      <main class="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
