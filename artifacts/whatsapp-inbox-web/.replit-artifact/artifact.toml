kind = "web"
previewPath = "/"
title = "Twilio WhatsApp Inbox"
description = "A publishable Flask web app that receives standard Twilio WhatsApp Sandbox webhook requests, stores messages locally, and displays them in an inbox."
version = "1.0.0"
id = "artifacts/whatsapp-inbox-web"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 5000

[services.development]
run = "python ../../main.py"

[services.production]

[services.production.build]
args = ["uv", "sync", "--frozen"]

[services.production.run]
args = ["gunicorn", "--chdir", "../..", "--bind", "0.0.0.0:5000", "--workers", "2", "app:app"]

[services.production.run.env]
PORT = "5000"

[services.production.health.startup]
path = "/healthz"

[services.env]
PORT = "5000"
