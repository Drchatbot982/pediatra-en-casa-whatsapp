kind = "api"
previewPath = "/"
title = "Twilio WhatsApp Inbox"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 5000
name = "WhatsApp Flask App"
paths = ["/"]

[services.development]
run = "python ../../main.py"

[services.production]

[services.production.build]
args = ["uv", "sync", "--frozen"]

[services.production.run]
args = ["gunicorn", "--chdir", "../..", "--bind", "0.0.0.0:5000", "--workers", "2", "app:app"]

[services.production.run.env]
PORT = "5000"

[services.production.health.startup]
path = "/healthz"
